name: build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            system: linux
          - name: macos-universal
            os: macos-latest
            system: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build distribution
        run: make -C project SYSTEM=${{ matrix.system }} flags distrib
      - uses: actions/upload-artifact@v4
        with:
          name: szs-${{ matrix.name }}
          path: project/latest-*.tar.gz
          if-no-files-found: error

  checksums:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create source archive
        run: |
          tag="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="wiimms-szs-tools-nintendo-${tag}/" \
            -o "wiimms-szs-tools-nintendo-${tag}-source.tar.gz" HEAD
      - name: Create checksums
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum wiimms-szs-tools-nintendo-*-source.tar.gz >> SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*
            wiimms-szs-tools-nintendo-*-source.tar.gz
            SHA256SUMS.txt
